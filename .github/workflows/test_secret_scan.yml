name: Betterleaks & Trivy Check

on:
  pull_request:
    branches: [main]
    
permissions:
  contents: read
  security-events: write
  actions: read
jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: trivy-dind
    outputs:
      trivy_send_mail: ${{ steps.trivy_report.outputs.send_mail }}
      trivy_mail_artifact: ${{ steps.trivy_report.outputs.artifact_name }}
      commit_author_email: ${{ steps.mail_metadata.outputs.commit_author_email }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
        
      # Image scanning is temporarily disabled.
      - name: Run Trivy Security Scans
        uses: svtechnmaa/.github/actions/trivy-fs-scan@fix/consolidated-trivy-report
        with:
          trivy-server:      ${{ secrets.TRIVY_SERVER }}
          enable-image-scan: "false"
          image-ref:         ""
          # enable-image-scan: ${{ steps.check_dockerfile.outputs.has_dockerfile }}
          # image-ref:         ${{ steps.build_images.outputs.image_refs }}

      - name: Inspect collected Trivy result status
        if: always()
        shell: bash
        run: |
          report_dir="${RUNNER_TEMP}/trivy-collect/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "report_dir_exists=$([ -d "$report_dir" ] && echo true || echo false)"
          shopt -s nullglob
          scan_dirs=("$report_dir"/scan.*)
          echo "collected_scan_count=${#scan_dirs[@]}"
          for scan_dir in "${scan_dirs[@]}"; do
            echo "scan_folder=$(basename "$scan_dir")"
            if [ -f "$scan_dir/meta.json" ]; then
              jq -c '{kind, target, scan_ok, ignore_finding}' "$scan_dir/meta.json"
            else
              echo "metadata_file=missing"
            fi
            if [ -f "$scan_dir/report.json" ] && jq -e . "$scan_dir/report.json" >/dev/null 2>&1; then
              jq -c '{schema_version: .SchemaVersion, results_type: (.Results | type), results_count: (if (.Results | type) == "array" then (.Results | length) else 0 end), vulnerability_count: ([.Results[]?.Vulnerabilities[]?] | length), secret_count: ([.Results[]?.Secrets[]?] | length), misconfiguration_count: ([.Results[]?.Misconfigurations[]?] | length)}' "$scan_dir/report.json"
            else
              echo "report_json=missing_or_invalid"
            fi
          done

      - name: Read commit author email
        id: mail_metadata
        if: always()
        shell: bash
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "commit_author_email=$(git show -s --format='%ae' "$COMMIT_SHA")" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for Trivy report
        if: always()
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Report all Trivy scans
        id: trivy_report
        if: always()
        uses: svtechnmaa/.github/actions/trivy-report@fix/consolidated-trivy-report

  trivy-mail:
    name: Send Trivy Report
    runs-on: trivy-dind
    needs: trivy-scan
    if: always() && needs.trivy-scan.outputs.trivy_send_mail == 'true'
    steps:
      - name: Send consolidated Trivy report
        uses: svtechnmaa/.github/actions/trivy-mail@fix/consolidated-trivy-report
        with:
          artifact_name: ${{ needs.trivy-scan.outputs.trivy_mail_artifact }}
          mail_username: ${{ vars.MAIL_USERNAME }}
          mail_password: ${{ secrets.MAIL_PASSWORD }}
          mail_receivers: ${{ needs.trivy-scan.outputs.commit_author_email }},${{ vars.DEFAULT_MAIL_RECIPIENTS }}
          it_team_email: ${{ vars.IT_TEAM_EMAIL }}
